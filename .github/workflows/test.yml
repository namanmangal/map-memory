# Lints and runs the unit and smoke tests on pushes to main and on every pull request.
name: Test

on:
  # Pushes to main, and every pull request (including Dependabot's). Not pushes to other branches as
  # well, which would test a pull request's changes twice.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Chrome is already installed on GitHub's Ubuntu runners; Firefox and WebKit (Safari's engine)
      # are Playwright's own builds, plus the system libraries they need.
      - run: npx playwright install --with-deps firefox webkit
      # Runs in all three browsers (GitHub sets CI, which turns Firefox on; see playwright.config.ts).
      - run: npm run test:smoke

      # On failure, keep Playwright's record of what happened (traces, screenshots) for a week.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
