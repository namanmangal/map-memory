<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set to the theme's background by src/lib/theme.ts -->
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="description" content="Learn the map: explore, quizzes and a daily challenge." />
    <title>Map Memory</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (mirrors src/lib/theme.ts).
      try {
        var t = localStorage.getItem('map-memory:theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
